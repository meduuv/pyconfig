[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pyconfig"
version = "0.1.0"
description = "Small dependency-free configuration helpers"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "meduuv"}]

[tool.setuptools.packages.find]
where = ["src"]
